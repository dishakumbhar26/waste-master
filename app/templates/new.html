{% extends "base.html" %}{% block title %}Request a pickup · WasteMaster{% endblock %}{% block body %}
<form class="card form narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h2>Request a pickup</h2>{% if error %}<div class="alert err" role="alert">{{ error }}</div>{% endif %}
<div class="ai"><label>Waste photo (optional, AI-assisted)<input type="file" id="photo" accept="image/jpeg,image/png,image/webp"></label>
<button type="button" class="btn btn-secondary btn-sm" id="aibtn">Classify photo</button><div id="aiout" role="status" aria-live="polite"></div><input type="hidden" name="ai_json" id="ai_json"></div>
<label>Waste type<select id="wt" name="waste_type">{% for t in types %}<option>{{ t }}</option>{% endfor %}</select></label>
<label>Quantity (tonnes)<input type="number" step="0.1" min="0.1" name="tons" required></label>
<label>Site address<input name="location" autocomplete="street-address" required></label>
<label>Preferred pickup date<input type="date" name="pickup_date" required></label>
<button class="btn btn-block">Post request</button><a class="btn btn-secondary btn-block" href="/dashboard">Cancel</a></form><script>
const out=document.getElementById('aiout');document.getElementById('aibtn').addEventListener('click',async()=>{const f=document.getElementById('photo').files[0];if(!f){out.textContent='Choose a photo first.';return}
out.textContent='Classifying…';const fd=new FormData();fd.append('image',f);fd.append('csrf_token',document.querySelector('meta[name=csrf-token]').content);
try{const j=await (await fetch('/ai/classify',{method:'POST',body:fd})).json();if(!j.ok){out.textContent=j.message;return}const c=j.result;
out.innerHTML='<p><b></b> <span></span></p><button type="button" class="btn btn-sm" id="use">Use AI prediction</button>';
out.querySelector('b').textContent='Predicted: '+c.material+(c.confidence!=null?' ('+Math.round(c.confidence*100)+'% model-reported confidence)':'');out.querySelector('span').textContent='Recyclable: '+(c.recyclable?'yes':'no')+'. '+c.recommended_action+(c.possible_reuse?' Possible reuse: '+c.possible_reuse:'')+' AI can be wrong; you can choose manually.';
document.getElementById('use').onclick=()=>{document.getElementById('wt').value=c.material;document.getElementById('ai_json').value=JSON.stringify(c);out.insertAdjacentText('beforeend',' Applied.')}}catch(e){out.textContent='AI classification unavailable — select material manually.'}});</script>{% endblock %}
