services:
  - type: web
    name: wastemaster
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - {key: PYTHON_VERSION, value: 3.11.9}
      - {key: ENVIRONMENT, value: production}
      - {key: SECRET_KEY, generateValue: true}
      - {key: DATABASE_URL, fromDatabase: {name: wastemaster-db, property: connectionString}}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
databases:
  - name: wastemaster-db
    databaseName: wastemaster
    plan: free
